<!doctype html>
<html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: https://raw.githubusercontent.com; connect-src 'self' https://api.github.com; base-uri 'none'; object-src 'none'; form-action 'none'"><title>AGRA — მართვა</title><link rel="stylesheet" href="./admin.css"><script src="./data.js" defer></script><script src="./admin.js" defer></script></head>
<body><header><a href="./index.html">AGRA USHGULI</a><span>მენიუს მართვა</span><button id="logout" hidden>გასვლა</button></header><main>
<section id="login"><h1>ადმინპანელი</h1><p>მართეთ კერძები, ფასები და ფოტოები. შესვლისთვის გამოიყენეთ ამ რეპოზიტორიაზე წვდომის მქონე GitHub-ის გასაღები.</p><form id="login-form"><label>GitHub access token<input id="token" type="password" required autocomplete="off" spellcheck="false"></label><button>შესვლა</button></form><p class="hint">გასაღები ფაილებში და ბრაუზერის საცავში არ ინახება. პანელის დახურვის შემდეგ ხელახლა შესვლა დაგჭირდებათ.</p></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="toolbar"><button id="add">კერძის დამატება</button><button id="download" class="secondary">ასლის ჩამოტვირთვა</button><button id="publish">ცვლილებების გამოქვეყნება</button></div><p id="state">ცვლილებები არ არის</p><div class="layout"><aside><label>კერძის ძიება<input id="filter" type="search"></label><div id="list"></div></aside><form id="editor"><fieldset id="fields"><legend>კერძის რედაქტირება</legend><label>სახელი ქართულად<input id="nameKa" required maxlength="3000"></label><label>სახელი ინგლისურად<input id="nameEn" required maxlength="3000"></label><div class="pair"><label>კატეგორია<select id="category"></select></label><label>ფასი ლარში<input id="price" required placeholder="20 ან 8 / 40"></label></div><label>აღწერა ქართულად<textarea id="descriptionKa" rows="3" maxlength="3000"></textarea></label><label>აღწერა ინგლისურად<textarea id="descriptionEn" rows="3" maxlength="3000"></textarea></label><label class="check"><input id="vegetarian" type="checkbox">ვეგეტარიანული — რეცეპტი გადამოწმებულია</label><label>აიქონი<select id="icon"></select></label><div class="photo"><img id="preview" alt="კერძის ფოტო" hidden><label>ფოტოს არჩევა (JPG, PNG, WebP; მაქს. 8 MB)<input id="upload" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="remove-photo" type="button" class="secondary">ფოტოს მოხსნა</button></div><button id="delete" type="button" class="danger">კერძის წაშლა</button></fieldset></form></div></section>
</main></body></html>
